version: "3.8"

services:

  database:
    image: postgres:16
    container_name: LMS_database_container
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mayank_sagar
      POSTGRES_DB: lms
      
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: mayank
      MINIO_ROOT_PASSWORD: mayank@1234
    volumes:
      - minio_data:/data

    
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: lms-backend
    container_name: LMS_backend_container
    depends_on:
      - database
      - minio
    ports:
      - "5000:5000"
      - "5555:5555"
    env_file:
      - ./server/.env
    volumes:
      - ./temp:/app/tmp
      - ./compressed:/app/compressed

volumes:
  postgres_data:
  minio_data: