version: "3.8"

services:

  database:
    image: postgres:16
    container_name: LMS_database_container
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mayank_sagar
      POSTGRES_DB: lms
    
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: lms-backend
    container_name: LMS_backend_container
    depends_on:
      - database
    ports:
      - "5000:5000"
      - "5555:5555"
    env_file:
      - ./server/.env

volumes:
  postgres_data: